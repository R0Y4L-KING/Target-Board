<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Target Board</title>
  <meta name="description" content="Target Board — choose your portal: Target Board V1 or Target Board V2." />
  <meta name="theme-color" content="#0f2027" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Target Board" />
  <meta property="og:description" content="Choose your portal — Target Board V1 or V2." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%230f2027'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%2300e5ff' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='14' fill='none' stroke='%23ff00ff' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='5' fill='%23ffffff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }

    /* Background gradient */
    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: radial-gradient(circle at top left, #0f2027, #203a43, #2c5364);
      font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: #fff;
      overflow-x: hidden;
    }

    /* Floating neon animation */
    .glow-bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 20% 30%, rgba(0, 255, 255, 0.3), transparent 60%),
                  radial-gradient(circle at 80% 70%, rgba(255, 0, 255, 0.25), transparent 60%);
      animation: moveGlow 8s infinite alternate ease-in-out;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }

    @keyframes moveGlow {
      0% { transform: translate(0, 0); }
      100% { transform: translate(20px, -20px); }
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 520px;
      text-align: center;
      background: rgba(0, 0, 0, 0.45);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      padding: 40px 26px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h2 {
      font-size: 26px;
      line-height: 1.3;
      margin: 0 0 30px;
      text-shadow: 0 0 10px cyan, 0 0 20px cyan;
    }

    /* Button grid */
    .button-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    /* Neon button */
    .neon-btn {
      display: block;
      width: 100%;
      padding: 15px 22px;
      font-family: inherit;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-align: center;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(90deg, #2ecc40 0%, #00b4ff 60%, #0a84ff 100%);
      border: 2px solid #ff2bd6;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 43, 214, 0.55), 0 0 25px rgba(0, 255, 255, 0.35);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
      transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
      animation: pulse 3s infinite;
      -webkit-tap-highlight-color: transparent;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 15px rgba(255, 43, 214, 0.55), 0 0 25px rgba(0, 255, 255, 0.35); }
      50%      { box-shadow: 0 0 25px rgba(0, 255, 255, 0.6), 0 0 40px rgba(255, 43, 214, 0.45); }
    }

    .neon-btn:hover,
    .neon-btn:focus-visible {
      transform: scale(1.05);
      filter: brightness(1.1);
      box-shadow: 0 0 25px cyan, 0 0 50px magenta;
      outline: none;
    }

    .neon-btn:active { transform: scale(0.99); }

    /* Footer */
    .footer {
      margin-top: 40px;
      font-size: 15px;
      color: #ccc;
      text-shadow: 0 0 10px cyan;
      z-index: 2;
      position: relative;
    }

    .footer span {
      color: #ff006e;
      display: inline-block;
      animation: heartbeat 1.5s infinite;
    }

    @keyframes heartbeat {
      0%, 20%, 40%, 60%, 80%, 100% { transform: scale(1); }
      30%, 50%, 70% { transform: scale(1.3); }
    }

    /* Wider screens: two columns */
    @media (min-width: 700px) {
      .button-grid {
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .glow-bg, .neon-btn, .footer span { animation: none; }
    }
  </style>
</head>
<body>
  <div class="glow-bg"></div>

  <main class="container">
    <h2>Choose Your Portal</h2>

    <div class="button-grid">
      <a class="neon-btn" href="https://targetboard.free.nf/?i=1" target="_blank" rel="noopener noreferrer">Target Board V1</a>
      <a class="neon-btn" href="https://ashrafcyberx-tb.vercel.app/courses" target="_blank" rel="noopener noreferrer">Target Board V2</a>
    </div>
  </main>

  <div class="footer">
    Share If You <span>&#10084;&#65039;</span> by <b>Our Work</b>
  </div>
</body>
</html>
