<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Target Board</title>
  <meta name="description" content="Target Board — choose your portal: Target Board V1 or Target Board V2." />
  <meta name="theme-color" content="#0a0f14" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Target Board" />
  <meta property="og:description" content="Choose your portal — Target Board V1 or V2." />
  <meta property="og:image" content="logo.png" />
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #ffc23c;
      --gold-deep: #ff9d00;
      --cyan: #35e3ff;
      --blue: #3b82f6;
      --ink: #0a0f14;
      --card: rgba(255, 255, 255, 0.05);
      --stroke: rgba(255, 255, 255, 0.12);
      --muted: #9fb0c0;
      --radius: 20px;
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      padding: 28px 18px calc(28px + env(safe-area-inset-bottom));
      background:
        radial-gradient(1100px 600px at 12% -10%, rgba(255, 194, 60, 0.16), transparent 60%),
        radial-gradient(900px 700px at 105% 110%, rgba(53, 227, 255, 0.16), transparent 60%),
        linear-gradient(160deg, #0b1218 0%, #0e1a22 45%, #0a0f14 100%);
      font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body.locked { overflow: hidden; }

    /* ---------- Splash screen ---------- */
    .splash {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(700px 500px at 50% 42%, rgba(255, 194, 60, 0.14), transparent 65%),
        radial-gradient(700px 500px at 50% 70%, rgba(53, 227, 255, 0.12), transparent 65%),
        #080d11;
      transition: opacity 0.55s ease, visibility 0.55s ease;
    }

    .splash.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 0 24px;
      text-align: center;
    }

    .splash-logo {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: contain;
      background: #fff;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15), 0 18px 45px rgba(0, 0, 0, 0.55);
      animation: splashPop 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both, splashGlow 2.4s ease-in-out 0.9s infinite;
    }

    @keyframes splashPop {
      0%   { opacity: 0; transform: scale(0.55); filter: blur(6px); }
      60%  { opacity: 1; transform: scale(1.06); filter: blur(0); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes splashGlow {
      0%, 100% { box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15), 0 18px 45px rgba(0, 0, 0, 0.55), 0 0 0 0 rgba(255, 194, 60, 0.35); }
      50%      { box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25), 0 18px 45px rgba(0, 0, 0, 0.55), 0 0 34px 8px rgba(255, 194, 60, 0.18); }
    }

    .splash-word {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: #fff;
      opacity: 0;
      animation: rise 0.7s ease 0.25s both;
    }

    .splash-word span { color: var(--gold); }

    .splash-tag {
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      animation: rise 0.7s ease 0.4s both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .splash-bar {
      width: 132px;
      height: 3px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
      margin-top: 4px;
    }

    .splash-bar i {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--gold), var(--cyan));
      animation: slide 1.15s ease-in-out infinite;
    }

    @keyframes slide {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(340%); }
    }

    /* ---------- Main card ---------- */
    .shell {
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 2;
      animation: fadeUp 0.7s ease 0.15s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card {
      position: relative;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.03));
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      padding: 34px 22px 26px;
      text-align: center;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -1px -1px auto -1px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--cyan), transparent);
      opacity: 0.75;
    }

    .brand-logo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: contain;
      background: #fff;
      display: block;
      margin: 0 auto 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.18);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .subtitle {
      margin: 0 0 24px;
      font-size: 13.5px;
      font-weight: 400;
      color: var(--muted);
    }

    /* ---------- Portal buttons ---------- */
    .portals {
      display: grid;
      gap: 12px;
    }

    .portal {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 14px;
      border-radius: 16px;
      border: 1px solid var(--stroke);
      background: rgba(255, 255, 255, 0.045);
      color: #fff;
      text-decoration: none;
      text-align: left;
      position: relative;
      overflow: hidden;
      transition: transform 0.22s ease, border-color 0.22s ease, background 0.22s ease, box-shadow 0.22s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .portal::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, var(--tint, transparent), transparent 55%);
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    .portal:hover,
    .portal:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.26);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45), 0 0 0 1px var(--glow, rgba(255, 255, 255, 0.1));
      outline: none;
    }

    .portal:hover::after,
    .portal:focus-visible::after { opacity: 0.22; }

    .portal:active { transform: translateY(0) scale(0.995); }

    .portal .chip {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--ink);
      background: linear-gradient(135deg, var(--gold), var(--gold-deep));
      box-shadow: 0 8px 20px rgba(255, 160, 0, 0.28);
    }

    .portal.v2 .chip {
      color: #04141a;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      box-shadow: 0 8px 20px rgba(53, 227, 255, 0.26);
    }

    .portal .texts { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

    .portal .label {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .portal .meta {
      font-size: 11.5px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .portal .chev {
      margin-left: auto;
      font-size: 20px;
      line-height: 1;
      color: rgba(255, 255, 255, 0.45);
      transition: transform 0.22s ease, color 0.22s ease;
    }

    .portal:hover .chev { transform: translateX(3px); color: #fff; }

    /* ---------- Footer ---------- */
    .foot {
      text-align: center;
      font-size: 12.5px;
      color: var(--muted);
      letter-spacing: 0.02em;
      position: relative;
      z-index: 2;
    }

    .foot .heart {
      color: #ff4d6d;
      display: inline-block;
      animation: beat 1.6s ease-in-out infinite;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      30%      { transform: scale(1.28); }
      60%      { transform: scale(1); }
    }

    .foot b { color: #e7eef5; font-weight: 600; }

    /* ---------- Responsive ---------- */
    @media (min-width: 560px) {
      .card { padding: 40px 30px 30px; }
      h1 { font-size: 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001s !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001s !important;
      }
      .splash { display: none; }
    }
  </style>
</head>
<body class="locked">

  <!-- Splash screen -->
  <div class="splash" id="splash" role="status" aria-label="Loading Target Board">
    <div class="splash-inner">
      <img class="splash-logo" src="logo.png" alt="Target Board logo" width="96" height="96" />
      <div class="splash-word">Target <span>Board</span></div>
      <div class="splash-tag">Choose your portal</div>
      <div class="splash-bar"><i></i></div>
    </div>
  </div>

  <!-- Main -->
  <main class="shell">
    <section class="card">
      <img class="brand-logo" src="logo.png" alt="Target Board logo" width="72" height="72" />
      <h1>Target Board</h1>
      <p class="subtitle">Pick a portal to continue</p>

      <div class="portals">
        <a class="portal v1" style="--tint: rgba(255,194,60,.9); --glow: rgba(255,194,60,.35);"
           href="https://targetboard.free.nf/?i=1" target="_blank" rel="noopener noreferrer">
          <span class="chip">V1</span>
          <span class="texts">
            <span class="label">Target Board V1</span>
            <span class="meta">Main portal</span>
          </span>
          <span class="chev" aria-hidden="true">&rsaquo;</span>
        </a>

        <a class="portal v2" style="--tint: rgba(53,227,255,.9); --glow: rgba(53,227,255,.35);"
           href="https://ashrafcyberx-tb.vercel.app/courses" target="_blank" rel="noopener noreferrer">
          <span class="chip">V2</span>
          <span class="texts">
            <span class="label">Target Board V2</span>
            <span class="meta">Courses portal</span>
          </span>
          <span class="chev" aria-hidden="true">&rsaquo;</span>
        </a>
      </div>
    </section>
  </main>

  <div class="foot">
    Share if you <span class="heart">&#10084;</span> &middot; by <b>Our Work</b>
  </div>

  <script>
    (function () {
      var splash = document.getElementById('splash');
      var done = false;

      function hideSplash() {
        if (done) return;
        done = true;
        document.body.classList.remove('locked');
        if (splash) {
          splash.classList.add('hide');
          window.setTimeout(function () {
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          }, 700);
        }
      }

      // Keep the splash on screen for a minimum time, then fade out.
      var MIN_SPLASH = 1700;
      var started = Date.now();

      function scheduleHide() {
        var wait = Math.max(0, MIN_SPLASH - (Date.now() - started));
        window.setTimeout(hideSplash, wait);
      }

      if (document.readyState === 'complete') {
        scheduleHide();
      } else {
        window.addEventListener('load', scheduleHide);
      }

      // Fail-safe: never let the splash block the page.
      window.setTimeout(hideSplash, 5000);

      // Tap to skip
      if (splash) splash.addEventListener('click', hideSplash);
    })();
  </script>
</body>
</html>
